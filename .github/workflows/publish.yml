# workflow to build docs site and publish to github pages

on:
  workflow_dispatch:
  push:
    branches: main

name: quarto-svelte-publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: "ubuntu-latest"
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      
      - uses: actions/checkout@v4
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.25
      
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Copy quarto-evelte extension; run npm install
        run: ./copy-extension.sh
        working-directory: ./docs
        shell: bash

      - name: List copied extension dir contents
        run: ls -a _extensions/quarto-svelte
        working-directory: ./docs
      
      # - name: Render quarto-svelte docs
      #   uses: quarto-dev/quarto-actions/render@v2
      #   with:
      #     path: docs

      - name: Render quarto-svelte docs (manually)
        run: quarto render
        working-directory: ./docs
      
      - name: Verify that compiled Svelte .js bundles are present
        run: |
          test -f docs/_site/Circles.js &&
          test -f docs/_site/examples/barchart/BarChart.js &&
          test -f docs/_site/examples/time-series/TimeSeriesChart.js
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs/_site"
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          
